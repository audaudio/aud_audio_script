name: aud_audio_script_example
description: "Example of aud_audio_script: a modulator runs the synthetic workload on the engine of aud_audio, on iOS and Android, with its statistics and a bench of QuickJS-ng."
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.4

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  # The example plays the package of this checkout.
  aud_audio_script:
    path: ../
  # The engine that runs the modulator, resolved from its git tags like an
  # app resolves it.
  aud_audio:
    git:
      url: git@github.com:audaudio/aud_audio.git
      tag_pattern: "{{version}}"
    version: ^0.4.3

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
