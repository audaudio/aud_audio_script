name: aud_audio_script
description: "Script modulation of the Audanika Audio Engine: the node aud.script.modulator runs JavaScript on QuickJS-ng in a worker of its own and sends controls once per audio buffer; optional, apps add it explicitly"
version: 0.1.0
publish_to: none
homepage: https://github.com/audaudio/aud_audio_script
repository: https://github.com/audaudio/aud_audio_script

environment:
  sdk: ^3.12.2

# The example resolves together with the package, so that upgrading the
# package upgrades the example too.
workspace:
  - example

dependencies:
  ffi: ^2.2.0
  aud_audio_core:
    git:
      url: git@github.com:audaudio/aud_audio_core.git
      tag_pattern: "{{version}}"
    version: ^0.5.2
  code_assets: ^2.1.0
  gg_quickjs: ^0.1.0
  hooks: ^2.2.0
  logging: ^1.3.0
  meta: ^1.19.0
  native_toolchain_c: ^0.19.5
  record_use: ^1.1.1

dev_dependencies:
  aud_audio_graph:
    git:
      url: git@github.com:audaudio/aud_audio_graph.git
      tag_pattern: "{{version}}"
    version: ^0.5.3
  dna_audanika: ^0.0.2
  ffigen: ^23.0.0
  flutter_lints: ^6.0.0
  helix: ^1.13.0
  # Within the test_api that flutter_test of the example pins.
  test: ^1.31.0

# The example plays on the engine of aud_audio, which pins exact versions of
# aud_audio_core and aud_audio_graph; the workspace takes the versions this
# package needs.
dependency_overrides:
  aud_audio_core:
    git:
      url: git@github.com:audaudio/aud_audio_core.git
      tag_pattern: "{{version}}"
    version: ^0.5.3
  aud_audio_graph:
    git:
      url: git@github.com:audaudio/aud_audio_graph.git
      tag_pattern: "{{version}}"
    version: ^0.5.4
